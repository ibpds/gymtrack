<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GymTrack | Meus Treinos</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/treinos.css">
</head>

<body>

    <div class="app-layout">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <a href="dashboard.html" class="sidebar-logo">
                <span class="logo-icon">G</span>
                <span>GYMTRACK</span>
            </a>

            <nav class="sidebar-nav">

                <a href="dashboard.html" class="nav-item">
                    <i data-lucide="layout-dashboard" class="nav-icon"></i>
                    <span>Dashboard</span>
                </a>

                <a href="treinos.html" class="nav-item active">
                    <i data-lucide="dumbbell" class="nav-icon"></i>
                    <span>Meus treinos</span>
                </a>

                <a href="progresso.html" class="nav-item">
                    <i data-lucide="chart-no-axes-column-increasing" class="nav-icon"></i>
                    <span>Progresso</span>
                </a>

            </nav>

            <div class="sidebar-footer">

                <a href="perfil.html" class="nav-item">
                    <i data-lucide="user-round" class="nav-icon"></i>
                    <span>Perfil</span>
                </a>

                <a href="../index.html" class="nav-item logout">
                    <i data-lucide="log-out" class="nav-icon"></i>
                    <span>Sair</span>
                </a>

            </div>

        </aside>


        <!-- MAIN -->
        <main class="treinos-main">

            <!-- HEADER -->
            <header class="page-header">

                <div>
                    <span class="page-eyebrow">TREINOS</span>

                    <h1>Meus treinos</h1>

                    <p>
                        Crie e organize suas fichas de treino.
                    </p>
                </div>

                <a href="treino-form.html" class="new-workout-btn">
                    <i data-lucide="plus"></i>
                    Novo treino
                </a>

            </header>


            <!-- TREINOS -->
            <section>

                <div class="workouts-header">

                    <h2>Seus treinos</h2>

                    <span id="workouts-count">
                        0 treinos
                    </span>

                </div>


                <div
    class="workouts-grid"
    id="workouts-grid"
></div>

            </section>

        </main>

    </div>


    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/treinos.js"></script>

</body>

</html>
